<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7f6">
<meta name="description" content="Interactive best-arm identification game for innovation and strategy classes.">
<title>Explore / Identify | Innovation Strategy Lab (v7)</title>
<style>
  :root {
    --ink:#14252b; --muted:#64747a; --line:#dce5e3; --paper:#f5f7f6; --white:#fff;
    --teal:#167c73; --teal-soft:#e5f4f0; --navy:#152b31; --blue:#496db4;
    --orange:#d97a46; --purple:#7562ac; --green:#16816e; --red:#c95d55;
    --shadow:0 14px 38px rgba(21,43,49,.055); --radius:21px;
  }
  *, *::before, *::after {box-sizing:border-box}
  html {scroll-behavior:smooth}
  body {margin:0; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5}
  button,input {font:inherit}
  button {cursor:pointer}
  button:disabled {cursor:not-allowed}
  button:focus-visible,input:focus-visible {outline:3px solid rgba(22,124,115,.36);outline-offset:3px}
  .shell {max-width:1160px;margin:0 auto;padding:0 30px 56px}
  header {display:flex;align-items:center;justify-content:space-between;gap:14px;padding:28px 0 26px;border-bottom:1px solid var(--line)}
  .brand {display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
  .brand-mark {display:flex;align-items:flex-end;gap:4px;width:36px;height:36px;background:var(--navy);border-radius:11px;padding:9px}
  .brand-mark i {display:block;background:#fff;border-radius:2px 2px 0 0;width:5px}
  .brand-mark i:nth-child(1){height:11px}.brand-mark i:nth-child(2){height:18px;background:#62c6a9}.brand-mark i:nth-child(3){height:14px}
  .brand-name{font-size:13px;font-weight:850;letter-spacing:.09em;line-height:1.2}
  .brand-sub{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.09em}
  .header-right {display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .header-kicker {color:var(--muted);font-size:12px;font-weight:650}
  .ghost-btn {border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;color:var(--ink);font-size:12px;font-weight:800}
  .ghost-btn:hover {border-color:#b2cac6;background:#fcfefd}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.19em;font-weight:850;color:var(--teal)}
  h1,h2,h3,p {margin-top:0}
  .hero {display:grid;grid-template-columns:1.12fr .88fr;gap:43px;align-items:center;padding-top:56px}
  .hero h1 {font-size:clamp(49px,6.5vw,86px);letter-spacing:-.068em;line-height:1.03;margin:15px 0 24px;font-weight:850}
  .hero h1 em {font-style:normal;color:var(--teal)}
  .lede {font-size:17px;max-width:550px;line-height:1.72;color:#586c70;margin-bottom:30px}
  .mini-stats{display:flex;gap:9px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #d7e2e0;background:#fff;border-radius:50px;padding:8px 12px;font-size:11px;font-weight:750;color:#536a6d}
  .pill strong{color:var(--ink)}
  .signal {width:7px;height:7px;background:var(--green);border-radius:50%}
  .hero-visual {border-radius:26px;background:#142c31;min-height:362px;padding:27px 26px 24px;position:relative;overflow:hidden;box-shadow:0 21px 55px rgba(20,44,49,.18);color:#fff}
  .hero-visual:before {content:"";width:310px;height:310px;border:1px solid rgba(255,255,255,.09);border-radius:100%;position:absolute;top:-168px;right:-155px;box-shadow:0 0 0 55px rgba(255,255,255,.018),0 0 0 106px rgba(255,255,255,.018)}
  .visual-head {display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:10px;letter-spacing:.14em;color:#b2ccc9;font-weight:850;position:relative}
  .visual-head span:last-child {color:#95d6bf}
  .visual-title {position:relative;font-size:27px;line-height:1.19;letter-spacing:-.04em;font-weight:750;max-width:240px;margin:34px 0 25px}
  .visual-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
  .visual-arm {background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.12);border-radius:14px;text-align:center;padding:16px 5px 15px}
  .visual-letter{font-weight:850;font-size:27px}.visual-question{margin-top:4px;color:#b4ccc7;font-size:13px;font-weight:700}
  .visual-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.11);margin-top:26px;padding-top:16px;font-size:12px;color:#a9c7c2}
  .visual-footer strong {color:#f6cd86;font-weight:700}
  .card {border:1px solid var(--line);background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow)}
  .setup {margin-top:38px;padding:28px 30px}
  .section-head {display:flex;justify-content:space-between;gap:22px;align-items:start;margin-bottom:22px}
  .section-head h2 {font-size:25px;letter-spacing:-.035em;line-height:1.2;margin:4px 0 8px}
  .subtle {font-size:13px;color:var(--muted);line-height:1.65}
  .setup-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .mode-card {text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:18px;min-height:139px;display:block;color:var(--ink);width:100%;position:relative;transition:background .18s,border-color .18s,transform .18s}
  .mode-card:hover:not(:disabled) {border-color:#7fbeb0;transform:translateY(-1px)}
  .mode-card.selected{border-color:var(--teal);background:#f3fbf8;box-shadow:inset 0 0 0 1px var(--teal)}
  .mode-card:disabled{opacity:.78}
  .mode-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:10px}
  .mode-title {font-size:15px;font-weight:800}
  .mode-icon {height:25px;width:25px;display:grid;place-items:center;border-radius:50%;background:#e8eeee;color:#496260;font-size:12px;font-weight:850}
  .selected .mode-icon {background:var(--teal);color:#fff}
  .mode-expl {font-size:12px;color:#667a7e;line-height:1.6;max-width:320px}
  .setup-bottom{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;margin-top:22px}
  .input-label{display:block;font-size:11px;font-weight:850;color:#536a6d;margin-bottom:9px;letter-spacing:.04em}
  .name-input,.text-input{height:48px;border:1px solid #d7e3e0;border-radius:11px;background:#fff;padding:0 14px;color:var(--ink);width:100%;max-width:420px;outline:none;font-size:13px}
  .name-input:focus,.text-input:focus{border-color:var(--teal)}
  .primary-btn {border:0;border-radius:12px;background:var(--teal);color:white;padding:14px 22px;font-size:13px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:48px;white-space:nowrap;box-shadow:0 5px 12px rgba(22,124,115,.15);transition:transform .18s,background .18s}
  .primary-btn:hover{background:#0c6159;transform:translateY(-1px)}
  .primary-btn:disabled{opacity:.45;transform:none}
  .secondary-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:12px 17px;font-size:12px;font-weight:800;min-height:45px}
  .secondary-btn:hover{background:#f5f9f7;border-color:#c1d3cf}
  .step-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0 5px}
  .step{padding:22px 21px;border-top:1px solid #dbe5e2;display:flex;gap:14px;align-items:start}
  .step-num{color:var(--teal);font-size:11px;font-weight:850;letter-spacing:.05em;padding-top:3px}
  .step strong{display:block;font-size:13px;margin-bottom:4px}.step span:last-child{font-size:12px;color:#718184;line-height:1.6}
  footer {display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:35px;padding:21px 0 0;color:#7c8a8d;font-size:11px}
  .game-intro{padding:29px 0 23px;display:flex;justify-content:space-between;gap:20px;align-items:end}
  .game-intro h1{font-size:clamp(28px,3.9vw,43px);letter-spacing:-.052em;margin:6px 0 6px;line-height:1.13}
  .status-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .small-badge {border-radius:50px;border:1px solid #d7e4e1;padding:7px 10px;color:#45605d;background:white;font-size:10px;font-weight:800}
  .small-badge.shock {color:#9b5b2f;background:#fff5eb;border-color:#f0d8bf}
  .game-scorebar{padding:17px 21px;display:grid;grid-template-columns:130px minmax(0,1fr) 145px;align-items:center;gap:25px}
  .small-label{font-size:10px;letter-spacing:.11em;color:var(--muted);text-transform:uppercase;font-weight:850}
  .number-big{font-size:29px;letter-spacing:-.04em;font-weight:850;line-height:1.2;margin-top:5px}
  .progress-track{height:9px;background:#e8efed;border-radius:20px;overflow:hidden;margin:12px 0 7px}
  .progress-fill{height:100%;background:var(--teal);border-radius:20px;transition:width .23s ease}
  .progress-between{display:flex;justify-content:space-between;color:#738384;font-size:10px;font-weight:700}
  .evidence-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:33px 0 17px}
  .evidence-head h2 {font-size:19px;letter-spacing:-.032em;margin:0}
  .evidence-note{font-size:12px;color:#718083;max-width:520px}
  .arms-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
  .arm-card {min-width:0;border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:19px;display:flex;flex-direction:column;gap:11px;min-height:252px;transition:border-color .15s,transform .15s,box-shadow .15s}
  .arm-card.can-play:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(13,56,52,.08);border-color:#9ccdc2}
  .arm-card.chosen{border-color:var(--teal);background:#f3faf7}
  .arm-top{display:flex;justify-content:space-between;align-items:center}
  .arm-letter{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#ecf0f8;color:#3c5b9d;font-size:18px;font-weight:850}
  .arm-B .arm-letter{background:#f3ecfb;color:#7556a0}.arm-C .arm-letter{background:#e6f4eb;color:#2c8a64}.arm-D .arm-letter{background:#fff1e3;color:#bb7637}
  .arm-count{font-size:11px;color:#849093;font-weight:800}
  .arm-title{font-size:14px;font-weight:850;margin-top:5px}
  .arm-sub{font-size:11px;color:#819092}
  .arm-observed{font-size:29px;font-weight:850;letter-spacing:-.05em;line-height:1.2}
  .arm-observed small {font-size:11px;letter-spacing:0;font-weight:650;color:#829193;margin-left:5px}
  .arm-bar{height:6px;background:#eef2f1;border-radius:9px;overflow:hidden}
  .arm-bar div{height:100%;background:#6c9bb7;border-radius:9px;transition:width .25s}
  .arm-B .arm-bar div{background:#a48cc4}.arm-C .arm-bar div{background:#77b799}.arm-D .arm-bar div{background:#e4b17d}
  .arm-btn {margin-top:auto;padding:10px;border-radius:10px;background:#e7f3ef;border:0;color:#0b776c;font-size:11px;font-weight:850;width:100%;min-height:39px}
  .arm-card.can-play .arm-btn:hover{background:#d7ece5}
  .arm-btn:disabled{background:#edf1ef;color:#98a5a3}
  .arm-latest{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:#819092;line-height:1.3;border-top:1px dashed #e3ebe9;padding-top:9px}
  .arm-latest em{font-style:normal;color:#a3afb1;font-size:10px}
  .arm-latest strong{font-size:17px;color:var(--ink);font-weight:850;letter-spacing:-.02em;white-space:nowrap}
  .arm-card.pending{border-color:var(--teal);background:#f3fbf8;box-shadow:0 0 0 3px rgba(22,124,115,.16)}
  .arm-confirm{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:auto}
  .arm-confirm .arm-btn{margin-top:0;background:var(--teal);color:#fff}
  .arm-confirm .arm-btn:hover{background:#126a62}
  .arm-cancel{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#56706d;font-size:12px;font-weight:800;min-height:39px}
  .arm-cancel:hover{border-color:#b2cac6}
  .evidence-note.pending-note{color:var(--teal);font-weight:800}
  .section-row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
  .evidence-block{margin-top:22px;padding:23px 26px}
  .evidence-block h3{font-size:16px;letter-spacing:-.025em;margin:0 0 4px}
  .segmented {display:flex;gap:3px;border:1px solid #dce6e3;background:#f4f7f6;border-radius:10px;padding:3px}
  .segment {border:0;background:transparent;color:#71817c;font-weight:750;font-size:11px;border-radius:7px;padding:7px 12px}
  .segment.active{background:#fff;box-shadow:0 1px 5px rgba(25,50,45,.09);color:var(--ink)}
  .evidence-matrix{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  .matrix-cell{background:#f6f9f8;border-radius:12px;padding:13px 14px;min-width:0}
  .matrix-cell label{display:block;font-size:10px;color:#687c7d;font-weight:800;margin-bottom:6px}
  .matrix-cell strong{font-size:14px}.matrix-cell span{display:block;font-size:10px;color:#8c9c9b;margin-top:2px}
  .feedback{margin-top:22px;border-radius:18px;padding:24px;display:flex;gap:22px;justify-content:space-between;align-items:center;background:var(--navy);color:white}
  .feedback.fail{background:#3d424c}
  .feedback-eyebrow{font-size:10px;letter-spacing:.14em;font-weight:850;color:#9ed7c8}
  .feedback.fail .feedback-eyebrow{color:#c7d1d2}
  .feedback h2{font-size:23px;letter-spacing:-.04em;margin:5px 0}
  .feedback p{font-size:12px;color:#c9dbd7;margin:0;max-width:540px}
  .feedback.fail p{color:#dae0e0}
  .feedback .primary-btn {background:white;color:var(--navy);box-shadow:none}
  .feedback .primary-btn:hover {background:#e7f2ef}
  .reflection-prompt{font-size:12px;color:#81908f;margin:20px 2px 0}
  .shock-screen{max-width:770px;margin:62px auto 40px;text-align:center}
  .shock-glyph{width:95px;height:95px;border-radius:27px;background:#fff1e8;color:#c26830;display:grid;place-items:center;font-size:42px;font-weight:850;margin:0 auto 24px;box-shadow:inset 0 0 0 1px #f0d3bb}
  .shock-screen h1{font-size:clamp(35px,6vw,61px);letter-spacing:-.055em;line-height:1.05;margin:12px 0 22px}
  .shock-screen p{color:#657779;font-size:16px;line-height:1.8;max-width:620px;margin:0 auto 25px}
  .shock-advice{max-width:630px;background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:24px auto;color:#536b68;font-size:13px;text-align:left}
  .shock-advice strong{display:block;color:var(--ink);margin-bottom:6px}
  .results-hero{padding:48px 0 25px}
  .results-hero h1{font-size:clamp(40px,6.4vw,71px);letter-spacing:-.06em;margin:10px 0 15px;line-height:1.08}
  .results-hero h1 em{font-style:normal;color:var(--teal)}
  .results-hero p{font-size:15px;color:#718184;max-width:690px;line-height:1.7}
  .metrics-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
  .metric{padding:22px 20px;min-width:0}
  .metric strong{display:block;font-size:clamp(24px,2.9vw,36px);letter-spacing:-.05em;margin:8px 0 4px;line-height:1.15;overflow-wrap:anywhere}
  .metric span:last-child{font-size:11px;color:#788a88;line-height:1.5;display:block}
  .results-grid{display:grid;grid-template-columns:1.26fr .74fr;gap:16px;margin-top:16px}
  .panel{padding:25px 26px}
  .panel h2{font-size:18px;letter-spacing:-.025em;margin:0 0 5px}
  .chart-wrap{margin-top:16px}
  .chart-wrap svg{display:block;width:100%;height:auto}
  .chart-legend{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 0;font-size:11px;font-weight:750;color:#637678}
  .legend-line{display:inline-block;width:25px;height:3px;vertical-align:middle;margin-right:8px;border-radius:4px;background:var(--teal)}
  .legend-line.oracle{background:repeating-linear-gradient(to right,#9da9a7 0 5px,transparent 5px 9px)}
  .prob-table{width:100%;border-collapse:collapse;margin-top:17px;font-size:12px}
  .prob-table th{text-align:left;color:#82908c;font-size:10px;letter-spacing:.04em;font-weight:800;padding:10px 4px;border-bottom:1px solid #e4ece9}
  .prob-table td{padding:10px 4px;border-bottom:1px solid #edf0ef}
  .prob-table td:not(:first-child){font-weight:800}
  .prob-table .winner{color:var(--teal)}
  .tiny{font-size:10px;color:#899893;line-height:1.65}
  .result-explainer{margin-top:16px;border-radius:12px;background:#edf7f3;padding:15px 16px;font-size:12px;color:#436861;line-height:1.65}
  .round-log{margin-top:16px}
  .round-log h2{font-size:18px;letter-spacing:-.03em}
  .round-pills{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:17px}
  .round-pill{border-radius:10px;background:#f2f6f5;border:1px solid #e6edeb;padding:10px 4px;text-align:center;font-size:10px}
  .round-pill.success{background:#ecf7ef;border-color:#d4eade}.round-pill.failure{background:#fbf1ef;border-color:#f4ded9}
  .round-pill .round-no{font-size:9px;color:#8a9b99}
  .round-pill .round-arm{font-size:15px;font-weight:850;margin:3px 0}
  .round-pill .round-payoff{font-size:10px;font-weight:850;color:#4a7162}
  .round-pill.failure .round-payoff{color:#a66b67}
  .results-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:25px}
  .questions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:19px}
  .question{border-top:1px solid #d8e4e0;padding:18px 8px 0 0;font-size:12px;color:#51696b;line-height:1.65}
  .question b{display:block;color:var(--teal);font-size:10px;letter-spacing:.11em;margin-bottom:7px}
  .overlay{position:fixed;z-index:100;inset:0;background:rgba(8,28,32,.56);display:flex;justify-content:center;align-items:center;padding:24px;overflow:auto}
  .modal{width:100%;max-width:680px;max-height:calc(100dvh - 48px);overflow:auto;background:white;border-radius:23px;padding:29px;box-shadow:0 24px 80px rgba(0,0,0,.23)}
  .modal-top{display:flex;justify-content:space-between;align-items:center;gap:15px}
  .modal h2{font-size:26px;letter-spacing:-.04em;margin:8px 0 5px}
  .close-btn {border:1px solid #e0e9e6;background:#fff;width:35px;height:35px;border-radius:10px;font-size:19px;line-height:1;color:#57706d}
  .divider{height:1px;background:#e5eeeb;margin:21px 0}
  .teacher-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .teacher-field label{display:block;font-size:11px;font-weight:850;color:#566c6e;margin-bottom:8px}
  .teacher-field select{width:100%;height:46px;padding:0 12px;border-radius:11px;background:white;border:1px solid #d7e3e0;color:var(--ink);font:inherit;font-size:13px}
  .teacher-field .text-input{max-width:none;height:46px}
  .link-box{background:#f4f8f6;border-radius:11px;padding:13px 14px;word-break:break-all;font-size:11px;color:#54716e;border:1px solid #dceae4;min-height:49px}
  .teacher-truth{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
  .teacher-truth th,.teacher-truth td{text-align:left;padding:9px 12px;border-bottom:1px solid #edf0ef}
  .teacher-truth th{font-size:10px;color:#788c89}
  .note{padding:13px 15px;border-radius:11px;background:#fff8ea;border:1px solid #f5e7cb;font-size:11px;color:#856935;line-height:1.65}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:#19372f;color:#fff;font-size:12px;font-weight:700;z-index:150;border-radius:11px;padding:12px 19px;box-shadow:0 9px 30px rgba(0,0,0,.18);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 30px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:850px){
    .hero{grid-template-columns:1fr;gap:24px;padding-top:38px}.hero-visual{min-height:300px}
    .hero h1{font-size:clamp(48px,10vw,78px)}
    .arms-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .results-grid{grid-template-columns:1fr}
    .metrics-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .round-pills{grid-template-columns:repeat(10,1fr)}
  }
  @media(max-width:600px){
    .shell{padding:0 16px 30px}header{padding:18px 0}.header-kicker{display:none}
    .hero h1{font-size:48px}.lede{font-size:15px}.hero-visual{padding:22px;min-height:310px}

    const counts=ARMS.map(a=>`${a}: ${aggregate(state.actions,a).paid} added tests, ${aggregate(state.actions,a).n} total observations, sample mean ${meanFmt(aggregate(state.actions,a).avg)}`).join('\n');
    const f=softmaxFit();
    return copyText(`Innovation Strategy Lab · Best-arm identification\nStudent: ${nameLabel()}\nSession: ${state.seed}\nRun ID: ${state.runId} (${RANDOMIZATION[state.mode].short})\nNoise: uniform ±${sig()}\nFree initial observations (independent per run): ${starting}\nDiscretionary trials: ${state.trials}\nFinal recommendation: ${state.finalGuess}\nTrue best: ${trueBest()}\nCorrect identification: ${state.finalGuess===trueBest()?'YES':'NO'}\nBinary exploration tau: ${tauFmt(tau())}\nWeighted exploration tau_w: ${tauFmt(weightedTau())} (sum weights ${weightFmt(weightedSum())})\nSoftmax temperature tau_hat (MLE): ${softTauFmt(f)}${softTauCi(f)?' (95% interval '+softTauCi(f)+')':''}\nNon-greedy choices: ${exploratoryCount()}/${state.trials}\nOptions retested: ${coverage()}/5\nIdentification loss: ${gap()}\nObjective: ${OBJECTIVES[state.objective].label}${safeArm()?'\nSafe option: '+safeArm()+' = '+state.means[safeArm()]+' (known, no noise)':''}\nCumulative paid-trial realized payoff: ${totalPayoff()}\nExpected payoff of choices (noise removed): ${expectedPayoff()} of a maximum ${maxPayoff()}\n${counts}\nSequence: ${state.actions.map(r=>r.arm).join(' ')}`);
  }
    document.addEventListener('input',e=>{
    if(e.target.id==='student-name')state.name=e.target.value;
    if(e.target.id==='teacher-seed'){
      state.draftSeed=e.target.value;state.teacherReveal=false;
      const preview=document.getElementById('link-preview');if(preview)preview.textContent=classLink(state.draftTrials,e.target.value,state.draftMode)||'Host index.html online to generate a shareable student link.';
      const ans=document.getElementById('answer-key');if(ans)ans.innerHTML='<p class="tiny" style="margin-top:11px">Answer key hidden. Reveal it again to see the updated assignment.</p>';
      const btn=document.querySelector('[data-action="reveal-key"]');if(btn)btn.textContent='Reveal answer key';
    }
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='teacher-trials'){state.draftTrials=getTrials(e.target.value);state.teacherReveal=false;render();}
    if(e.target.id==='teacher-gamma'){state.draftGamma=getGamma(e.target.value);state.teacherReveal=false;render();}
    if(e.target.id==='teacher-round'){state.draftRound=getRound(e.target.value);state.teacherReveal=false;render();}
    if(e.target.id==='teacher-payoff'){state.draftPayoff=payoffSpecString(parsePayoffSpec(e.target.value));state.teacherReveal=false;render();}
    if(e.target.id==='teacher-mode'){state.draftMode=getMode(e.target.value);state.teacherReveal=false;render();}
    if(e.target.id==='teacher-objective'){state.draftObjective=getObjective(e.target.value);render();}
  });
  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(state.teacherOpen){state.teacherOpen=false;render();}else if(state.pendingArm){state.pendingArm=null;render();}});
  document.addEventListener('click',e=>{
    if(e.target.id==='modalBackdrop'){state.teacherOpen=false;state.teacherReveal=false;render();return;}
    const el=e.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action;
    if(action==='go-home'){e.preventDefault();if(state.screen==='home')return;if(state.actions.length&&!window.confirm('Leave this experiment? Current progress will be lost.'))return;state.screen='home';state.actions=[];state.pendingArm=null;state.phase='playing';state.finalGuess=null;render(true);}
    else if(action==='teacher'){state.draftTrials=state.trials;state.draftGamma=state.gamma;state.draftRound=state.round;state.draftPayoff=payoffSpecString(state.payoff);state.draftObjective=state.objective;state.draftSeed=state.seed;state.draftMode=state.mode;state.teacherReveal=false;state.teacherOpen=true;render();}
    else if(action==='close-teacher'){state.teacherOpen=false;state.teacherReveal=false;render();}
    else if(action==='start')start();
    else if(action==='invest'){if(state.screen==='game'&&state.phase==='playing'&&ARMS.includes(el.dataset.arm)){state.pendingArm=el.dataset.arm;render();}}
    else if(action==='confirm-invest'){if(state.pendingArm===el.dataset.arm)invest(el.dataset.arm);}
    else if(action==='cancel-invest'){state.pendingArm=null;render();}
    else if(action==='next')next();
    else if(action==='choose-final'&&state.screen==='final'){state.selectedGuess=el.dataset.arm;render();}
    else if(action==='submit-final'&&state.screen==='final'&&state.selectedGuess){state.finalGuess=state.selectedGuess;state.screen='results';state.submitStatus='idle';state.submitError='';submitResult();render(true);}
    else if(action==='replay')replay();
    else if(action==='new-draw'&&!state.classroom)replay(true);
    else if(action==='csv')downloadCsv();
    else if(action==='copy-results')copySummary();
    else if(action==='copy-code')copyText(resultCode());
    else if(action==='apply-teacher')applyTeacher();
    else if(action==='reveal-key'){state.teacherReveal=!state.teacherReveal;render();}
    else if(action==='copy-link'){const link=classLink();if(link)copyText(link);else toast('Host the page online to obtain a student link');}
  });
  render();
  subscribeLive();
})();

</script>

</html>
